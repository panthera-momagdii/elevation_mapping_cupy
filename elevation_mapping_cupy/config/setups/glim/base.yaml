/**:
  ros__parameters:
    # GLIM with base_frame_id="" auto-picks the IMU frame as base_frame.
    # For Ouster bags that's "os_sensor"; change here if your bag uses a
    # different IMU header.frame_id (check with `ros2 topic echo /tf --once`).
    map_frame: 'odom'
    base_frame: 'os_sensor'
    corrected_map_frame: 'odom'

    initialize_frame_id: ['os_sensor']
    initialize_tf_offset: [0.0]

    subscribers:
      lidar:
        topic_name: '/glim_ros/points'
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 5.0
      elevation_map_filter:
        layers: ['min_filter', 'smooth', 'inpaint', 'elevation', 'traversability']
        basic_layers: ['min_filter']
        fps: 3.0
