/**:
  ros__parameters:
    # Global elevation map: large, slow, fixed in GLIM's loop-closed `map` frame.
    # Loop-closure jumps are tolerable here because the cells are coarse.
    map_frame: 'map'
    base_frame: 'os_sensor'
    corrected_map_frame: 'map'

    initialize_frame_id: ['os_sensor']
    initialize_tf_offset: [0.0]

    map_length: 100.0
    resolution: 0.25

    update_pose_fps: 2.0
    update_variance_fps: 1.0
    map_acquire_fps: 1.0
    recordable_fps: 1.0

    service_namespace: '/elevation_mapping_global'

    subscribers:
      lidar:
        topic_name: '/glim_ros/points'
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 1.0
      elevation_map_filter:
        layers: ['min_filter', 'smooth', 'inpaint', 'elevation', 'traversability']
        basic_layers: ['min_filter']
        fps: 0.5
